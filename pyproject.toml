[project]
name = "finpersona"
version = "0.1.0"
description = "Local banking analytics workflows for credit risk, churn prediction, and product recommendation."
authors = [{ name = "FinPersona contributors" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.0,<4.0",
    "requests>=2.31,<3.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.0,<5.0",
    "imbalanced-learn>=0.11,<1.0",
    "scipy>=1.10,<2.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "openpyxl>=3.1,<4.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
black = ">=25.1,<26.0"
flake8 = ">=7.0,<8.0"
isort = ">=5.13,<6.0"

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | assests
  | data
  | outputs
  | train/credit/output
)/
'''

[tool.isort]
profile = "black"
line_length = 88
py_version = 311
skip = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "assests",
    "data",
    "outputs",
    "train/credit/output",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
